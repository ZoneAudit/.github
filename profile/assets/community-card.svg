<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#000033" />
  
  <!-- Subtle Grid Pattern for "Engineering" look -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)" />

  <!-- Primary Accent Bar -->
  <rect x="0" y="320" width="800" height="80" fill="#e1163c" />

  <!-- Tech Graphic (Network/Terminal style) -->
  <g opacity="0.4" transform="translate(620, 80) scale(1.2)">
    <rect x="0" y="0" width="120" height="160" rx="4" fill="none" stroke="white" stroke-width="2" />
    <line x1="10" y1="30" x2="110" y2="30" stroke="white" stroke-width="1" />
    <path d="M 20 50 L 40 50 M 20 70 L 80 70 M 20 90 L 60 90" stroke="white" stroke-width="2" />
    <circle cx="100" cy="140" r="10" fill="#e1163c" />
  </g>

  <!-- Typography -->
  <text x="40" y="80" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="bold" fill="white" letter-spacing="2">ZONEAUDIT™</text>
  <text x="40" y="140" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="900" fill="white">Community Edition</text>
  
  <!-- Red Bar -->
  <rect x="40" y="165" width="80" height="4" fill="#e1163c" />

  <!-- Actionable Text -->
  <text x="40" y="210" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="white">Map digital perimeters at scale</text>
  <text x="40" y="240" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="white">with high-velocity Go telemetry.</text>
  
  <text x="40" y="370" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="bold" fill="white">OSS / GO-POWERED</text>
</svg>