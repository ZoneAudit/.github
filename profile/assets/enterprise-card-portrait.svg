<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#000033" />
  
  <!-- Subtle Grid Pattern & Glow -->
  <defs>
    <pattern id="grid-port-ent" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow-port" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#e1163c;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000033;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#grid-port-ent)" />
  <rect width="400" height="300" fill="url(#glow-port)" />

  <!-- Primary Accent Bar -->
  <rect x="0" y="520" width="400" height="80" fill="#e1163c" />

  <!-- Typography: Header -->
  <text x="40" y="80" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" letter-spacing="2">ZONEAUDIT™</text>
  
  <!-- Main Title -->
  <text x="40" y="140" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="900" fill="white">Enterprise</text>
  
  <!-- Red Bar -->
  <rect x="40" y="160" width="80" height="4" fill="#e1163c" />

  <!-- Descriptive Text -->
  <text x="40" y="200" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700" fill="white">Drive operational clarity with</text>
  <text x="40" y="225" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700" fill="white">the active DeepScan™ engine</text>
  <text x="40" y="250" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700" fill="white">and intelligence pipeline.</text>

  <!-- Tech Graphic (Engine/Radar style) -->
  <g opacity="0.6" transform="translate(200, 380)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="white" stroke-width="1" stroke-dasharray="5,5" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="2" />
    <line x1="0" y1="-90" x2="0" y2="90" stroke="white" stroke-opacity="0.2" />
    <line x1="-90" y1="0" x2="90" y2="0" stroke="white" stroke-opacity="0.2" />
    <circle cx="30" cy="-30" r="6" fill="#e1163c" />
    <circle cx="-10" cy="40" r="4" fill="white" />
  </g>
  
  <!-- Bottom Bar Text -->
  <text x="200" y="570" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">PRECISION ANALYSIS</text>
</svg>